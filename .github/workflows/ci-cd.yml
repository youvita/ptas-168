name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm turbo run build

      - name: Test (backend)
        run: pnpm --filter ptas168-backend test

  deploy:
    name: Deploy → Mac Mini
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    environment: Production
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write compose .env from secrets
        env:
          JWT_SECRET:                   ${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BANK_BOT_TOKEN:      ${{ secrets.TELEGRAM_BANK_BOT_TOKEN }}
          TELEGRAM_BANK_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_BANK_WEBHOOK_SECRET }}
          R2_ACCOUNT_ID:                ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:             ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:         ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:                    ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL:                ${{ secrets.R2_PUBLIC_URL }}
          CORS_ORIGIN:                  ${{ vars.CORS_ORIGIN || 'https://ptas168.kilozin.xyz' }}
          FILE_URL_BASE:                ${{ vars.FILE_URL_BASE || 'https://cdn.kilozin.xyz' }}
          POSTGRES_PORT:                ${{ vars.POSTGRES_PORT || '5433' }}
          REDIS_PORT:                   ${{ vars.REDIS_PORT || '6379' }}
          BACKEND_PORT:                 ${{ vars.BACKEND_PORT || '3002' }}
          FRONTEND_PORT:                ${{ vars.FRONTEND_PORT || '8082' }}
        run: |
          : "${JWT_SECRET:?missing GitHub secret JWT_SECRET}"
          : "${TELEGRAM_BOT_TOKEN:?missing GitHub secret TELEGRAM_BOT_TOKEN}"
          umask 077
          {
            printf 'POSTGRES_PORT=%s\n'                "$POSTGRES_PORT"
            printf 'REDIS_PORT=%s\n'                   "$REDIS_PORT"
            printf 'BACKEND_PORT=%s\n'                 "$BACKEND_PORT"
            printf 'FRONTEND_PORT=%s\n'                "$FRONTEND_PORT"
            printf 'JWT_SECRET=%s\n'                   "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=24h\n'
            printf 'TELEGRAM_BOT_TOKEN=%s\n'           "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_BANK_BOT_TOKEN=%s\n'      "$TELEGRAM_BANK_BOT_TOKEN"
            printf 'TELEGRAM_BANK_WEBHOOK_SECRET=%s\n' "$TELEGRAM_BANK_WEBHOOK_SECRET"
            printf 'LOG_LEVEL=info\n'
            printf 'CORS_ORIGIN=%s\n'                  "$CORS_ORIGIN"
            printf 'FILE_URL_BASE=%s\n'                "$FILE_URL_BASE"
            printf 'API_BASE_PATH=/api\n'
            printf 'VITE_BASE_PATH=/ptas168/\n'
            printf 'VITE_API_URL=/ptas168/api\n'
            printf 'VITE_FILE_URL=/ptas168/files\n'
            printf 'R2_ACCOUNT_ID=%s\n'                "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID=%s\n'             "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n'         "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET=%s\n'                    "$R2_BUCKET"
            printf 'R2_PUBLIC_URL=%s\n'                "$R2_PUBLIC_URL"
          } > .env
          chmod 600 .env

      - name: Build and start Docker stack
        run: |
          # LaunchAgent sessions cannot unlock osxkeychain. Isolate Docker
          # config so public Hub pulls do not go through the GUI helper.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"

          COMPOSE="docker compose --env-file .env -f infrastructure/docker/docker-compose.yml"
          $COMPOSE build
          $COMPOSE up -d postgres redis
          for i in $(seq 1 30); do
            if docker exec ptas168_postgres pg_isready -U postgres -d ptas168_dev >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec ptas168_postgres pg_isready -U postgres -d ptas168_dev
          $COMPOSE run --rm --no-deps --workdir /repo --entrypoint "" backend \
            pnpm --filter @ptas/db deploy
          $COMPOSE up -d backend worker telegram-bot frontend
          $COMPOSE ps

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="✅ Deployment successful"
          else
            STATUS="❌ Deployment failed"
          fi

          COMMIT_LINE="${COMMIT_MESSAGE%%$'\n'*}"

          MESSAGE="$STATUS

          Project: $REPO_NAME
          Branch: $BRANCH
          By: $ACTOR
          Commit: ${COMMIT_LINE:-(manual run)}"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MESSAGE"
